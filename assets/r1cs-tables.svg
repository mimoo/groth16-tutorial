    <line class="grid" x1="0" y1="45" x2="156" y2="45"/>
    <line class="grid" x1="0" y1="90" x2="156" y2="90"/>
    <line class="grid" x1="0" y1="135" x2="156" y2="135"/>
    <line class="grid" x1="26"  y1="0" x2="26"  y2="180"/>
    <line class="grid" x1="52"  y1="0" x2="52"  y2="180"/>
    <line class="grid" x1="78"  y1="0" x2="78"  y2="180"/>
    <line class="grid" x1="104" y1="0" x2="104" y2="180"/>
    <line class="grid" x1="130" y1="0" x2="130" y2="180"/>

    <text class="cell" x="13"  y="29" text-anchor="middle">5</text>
    <text class="cell" x="39"  y="29" text-anchor="middle">0</text>
    <text class="cell" x="65"  y="29" text-anchor="middle">0</text>
    <text class="cell" x="91"  y="29" text-anchor="middle">0</text>
    <text class="cell" x="117" y="29" text-anchor="middle">0</text>
    <text class="cell" x="143" y="29" text-anchor="middle">0</text>

    <text class="cell" x="13"  y="74" text-anchor="middle">0</text>
    <text class="cell" x="39"  y="74" text-anchor="middle">0</text>
    <text class="cell" x="65"  y="74" text-anchor="middle">0</text>
    <text class="cell" x="91"  y="74" text-anchor="middle">0</text>
    <text class="cell" x="117" y="74" text-anchor="middle">0</text>
    <text class="cell" x="143" y="74" text-anchor="middle">4</text>

    <text class="cell" x="13"  y="119" text-anchor="middle">…</text>
    <text class="cell" x="39"  y="119" text-anchor="middle">…</text>
    <text class="cell" x="65"  y="119" text-anchor="middle">…</text>
    <text class="cell" x="91"  y="119" text-anchor="middle">…</text>
    <text class="cell" x="117" y="119" text-anchor="middle">…</text>
    <text class="cell" x="143" y="119" text-anchor="middle">…</text>

    <text class="cell" x="13"  y="164" text-anchor="middle">…</text>
    <text class="cell" x="39"  y="164" text-anchor="middle">…</text>
    <text class="cell" x="65"  y="164" text-anchor="middle">…</text>
    <text class="cell" x="91"  y="164" text-anchor="middle">…</text>
    <text class="cell" x="117" y="164" text-anchor="middle">…</text>
    <text class="cell" x="143" y="164" text-anchor="middle">…</text>
  </g>

  <!-- a (smaller, sized to its own entries) -->
  <g transform="translate(640,50)">
    <text class="lbl" x="13" y="-20" text-anchor="middle">a</text>
    <rect class="box-a" x="0" y="0" width="26" height="120" rx="4"/>
    <line class="grid" x1="0" y1="20"  x2="26" y2="20"/>
    <line class="grid" x1="0" y1="40"  x2="26" y2="40"/>
    <line class="grid" x1="0" y1="60"  x2="26" y2="60"/>
    <line class="grid" x1="0" y1="80"  x2="26" y2="80"/>
    <line class="grid" x1="0" y1="100" x2="26" y2="100"/>
    <text class="cell" x="13" y="14"  text-anchor="middle">1</text>
    <text class="cell" x="13" y="34"  text-anchor="middle">a₁</text>
    <text class="cell" x="13" y="54"  text-anchor="middle">a₂</text>
    <text class="cell" x="13" y="74"  text-anchor="middle">a₃</text>
    <text class="cell" x="13" y="94"  text-anchor="middle">a₄</text>
    <text class="cell" x="13" y="114" text-anchor="middle">a₅</text>
  </g>
</svg>
