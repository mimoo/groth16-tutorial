<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="R1CS as four tables U, V, W, a">
  <style>
    .lbl  { font: 600 16px ui-sans-serif, system-ui, sans-serif; fill: #1f2937; }
    .cell { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1f2937; }
    .head { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6b7280; }
    .row  { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6b7280; }
    .box  { fill: #fff; stroke: #94a3b8; stroke-width: 1; }
    .box-a { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.2; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
  </style>

  <!-- gate row labels (left of U) -->
  <g transform="translate(10,50)">
    <text class="row" x="60" y="29"  text-anchor="end">gate 0 →</text>
    <text class="row" x="60" y="74"  text-anchor="end">gate 1 →</text>
    <text class="row" x="60" y="119" text-anchor="end">gate 2 →</text>
    <text class="row" x="60" y="164" text-anchor="end">… →</text>
  </g>

  <!-- U -->
  <g transform="translate(80,50)">
    <text class="lbl" x="78" y="-20" text-anchor="middle">U</text>
    <text class="head" x="13"  y="-4" text-anchor="middle">a₀</text>
    <text class="head" x="39"  y="-4" text-anchor="middle">a₁</text>
    <text class="head" x="65"  y="-4" text-anchor="middle">a₂</text>
    <text class="head" x="91"  y="-4" text-anchor="middle">a₃</text>
    <text class="head" x="117" y="-4" text-anchor="middle">a₄</text>
    <text class="head" x="143" y="-4" text-anchor="middle">a₅</text>
    <rect class="box" x="0" y="0" width="156" height="180" rx="4"/>
    <line class="grid" x1="0" y1="45" x2="156" y2="45"/>
    <line class="grid" x1="0" y1="90" x2="156" y2="90"/>
    <line class="grid" x1="0" y1="135" x2="156" y2="135"/>
    <line class="grid" x1="26"  y1="0" x2="26"  y2="180"/>
    <line class="grid" x1="52"  y1="0" x2="52"  y2="180"/>
    <line class="grid" x1="78"  y1="0" x2="78"  y2="180"/>
    <line class="grid" x1="104" y1="0" x2="104" y2="180"/>
    <line class="grid" x1="130" y1="0" x2="130" y2="180"/>

    <text class="cell" x="13"  y="29" text-anchor="middle">0</text>
    <text class="cell" x="39"  y="29" text-anchor="middle">0</text>
    <text class="cell" x="65"  y="29" text-anchor="middle">0</text>
    <text class="cell" x="91"  y="29" text-anchor="middle">1</text>
    <text class="cell" x="117" y="29" text-anchor="middle">1</text>
    <text class="cell" x="143" y="29" text-anchor="middle">0</text>

    <text class="cell" x="13"  y="74" text-anchor="middle">0</text>
    <text class="cell" x="39"  y="74" text-anchor="middle">0</text>
    <text class="cell" x="65"  y="74" text-anchor="middle">0</text>
    <text class="cell" x="91"  y="74" text-anchor="middle">1</text>
    <text class="cell" x="117" y="74" text-anchor="middle">0</text>
    <text class="cell" x="143" y="74" text-anchor="middle">0</text>

    <text class="cell" x="13"  y="119" text-anchor="middle">…</text>
    <text class="cell" x="39"  y="119" text-anchor="middle">…</text>
    <text class="cell" x="65"  y="119" text-anchor="middle">…</text>
    <text class="cell" x="91"  y="119" text-anchor="middle">…</text>
    <text class="cell" x="117" y="119" text-anchor="middle">…</text>
    <text class="cell" x="143" y="119" text-anchor="middle">…</text>

    <text class="cell" x="13"  y="164" text-anchor="middle">…</text>
    <text class="cell" x="39"  y="164" text-anchor="middle">…</text>
    <text class="cell" x="65"  y="164" text-anchor="middle">…</text>
    <text class="cell" x="91"  y="164" text-anchor="middle">…</text>
    <text class="cell" x="117" y="164" text-anchor="middle">…</text>
    <text class="cell" x="143" y="164" text-anchor="middle">…</text>
  </g>

  <!-- V -->
  <g transform="translate(260,50)">
    <text class="lbl" x="78" y="-20" text-anchor="middle">V</text>
    <text class="head" x="13"  y="-4" text-anchor="middle">a₀</text>
    <text class="head" x="39"  y="-4" text-anchor="middle">a₁</text>
    <text class="head" x="65"  y="-4" text-anchor="middle">a₂</text>
    <text class="head" x="91"  y="-4" text-anchor="middle">a₃</text>
    <text class="head" x="117" y="-4" text-anchor="middle">a₄</text>
    <text class="head" x="143" y="-4" text-anchor="middle">a₅</text>
    <rect class="box" x="0" y="0" width="156" height="180" rx="4"/>
    <line class="grid" x1="0" y1="45" x2="156" y2="45"/>
    <line class="grid" x1="0" y1="90" x2="156" y2="90"/>
    <line class="grid" x1="0" y1="135" x2="156" y2="135"/>
    <line class="grid" x1="26"  y1="0" x2="26"  y2="180"/>
    <line class="grid" x1="52"  y1="0" x2="52"  y2="180"/>
    <line class="grid" x1="78"  y1="0" x2="78"  y2="180"/>
    <line class="grid" x1="104" y1="0" x2="104" y2="180"/>
    <line class="grid" x1="130" y1="0" x2="130" y2="180"/>

    <text class="cell" x="13"  y="29" text-anchor="middle">1</text>
    <text class="cell" x="39"  y="29" text-anchor="middle">0</text>
    <text class="cell" x="65"  y="29" text-anchor="middle">0</text>
    <text class="cell" x="91"  y="29" text-anchor="middle">0</text>
    <text class="cell" x="117" y="29" text-anchor="middle">0</text>
    <text class="cell" x="143" y="29" text-anchor="middle">0</text>

    <text class="cell" x="13"  y="74" text-anchor="middle">0</text>
    <text class="cell" x="39"  y="74" text-anchor="middle">0</text>
    <text class="cell" x="65"  y="74" text-anchor="middle">0</text>
    <text class="cell" x="91"  y="74" text-anchor="middle">0</text>
    <text class="cell" x="117" y="74" text-anchor="middle">1</text>
    <text class="cell" x="143" y="74" text-anchor="middle">0</text>

    <text class="cell" x="13"  y="119" text-anchor="middle">…</text>
    <text class="cell" x="39"  y="119" text-anchor="middle">…</text>
    <text class="cell" x="65"  y="119" text-anchor="middle">…</text>
    <text class="cell" x="91"  y="119" text-anchor="middle">…</text>
    <text class="cell" x="117" y="119" text-anchor="middle">…</text>
    <text class="cell" x="143" y="119" text-anchor="middle">…</text>

    <text class="cell" x="13"  y="164" text-anchor="middle">…</text>
    <text class="cell" x="39"  y="164" text-anchor="middle">…</text>
    <text class="cell" x="65"  y="164" text-anchor="middle">…</text>
    <text class="cell" x="91"  y="164" text-anchor="middle">…</text>
    <text class="cell" x="117" y="164" text-anchor="middle">…</text>
    <text class="cell" x="143" y="164" text-anchor="middle">…</text>
  </g>

  <!-- W -->
  <g transform="translate(440,50)">
    <text class="lbl" x="78" y="-20" text-anchor="middle">W</text>
    <text class="head" x="13"  y="-4" text-anchor="middle">a₀</text>
    <text class="head" x="39"  y="-4" text-anchor="middle">a₁</text>
    <text class="head" x="65"  y="-4" text-anchor="middle">a₂</text>
    <text class="head" x="91"  y="-4" text-anchor="middle">a₃</text>
    <text class="head" x="117" y="-4" text-anchor="middle">a₄</text>
    <text class="head" x="143" y="-4" text-anchor="middle">a₅</text>
