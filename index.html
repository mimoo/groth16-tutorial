<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Groth16, Incrementally — build a SNARK from scratch</title>
    <meta
      name="description"
      content="An interactive tutorial that builds Groth16 from R1CS to the final verifier equation, one runnable exercise at a time."
    />
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="src/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%94%90%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot__inner">
        <div class="boot__spinner"></div>
        <p>Loading the toy curve…</p>
      </div>
    </div>

    <header class="topbar">
      <a class="topbar__brand" href="#/" data-nav>
        <span class="topbar__mark">G16</span>
        <span class="topbar__title">Groth16, Incrementally</span>
      </a>
      <div class="topbar__right">
        <div class="progress" title="Exercises solved">
          <div class="progress__track"><div class="progress__fill" id="progress-fill"></div></div>
          <span class="progress__label" id="progress-label">0 / 0</span>
        </div>
        <button class="btn btn--ghost" id="btn-reset" type="button">Reset progress</button>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar" id="sidebar" aria-label="Chapters"></nav>
      <main class="main" id="main"></main>
    </div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
